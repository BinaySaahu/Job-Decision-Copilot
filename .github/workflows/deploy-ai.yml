name: Deploy FastAPI to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - "fastapi/**"
      - ".github/workflows/deploy-ai.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  FUNCTION_NAME: JobDecisionAi

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fastapi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
            python-version: "3.12"

      - name: Create deployment package
        run: |
            rm -rf package lambda.zip
            mkdir package

            python -m pip install --upgrade pip

            pip install \
            --no-cache-dir \
            -r requirements.txt \
            -t package

            cp *.py package/

            cd package
            zip -r9 ../lambda.zip .

      - name: Check deployment package size
        run: |
                ls -lh lambda.zip
                du -sh package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::790954697390:role/GitHubDeploymentRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --zip-file fileb://lambda.zip